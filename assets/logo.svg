<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple Cards logo: fanned pastel flashcards on white, matching the app's
       translucent-pastel-on-white design language. -->
  <rect width="640" height="640" fill="#ffffff"/>

  <g transform="translate(320, 330)">
    <!-- back card, lilac -->
    <g transform="rotate(-14)">
      <rect x="-125" y="-170" width="250" height="340" rx="34" fill="#e3d6ff" opacity="0.75"/>
    </g>
    <!-- middle card, mint -->
    <g transform="rotate(9)">
      <rect x="-125" y="-170" width="250" height="340" rx="34" fill="#c9f0e1" opacity="0.85"/>
    </g>
    <!-- front card, sky -->
    <g transform="rotate(-3)">
      <rect x="-125" y="-178" width="250" height="340" rx="34" fill="#cfe6ff"/>
      <text x="0" y="-30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
            font-size="118" font-weight="700" fill="#3a3a45">Aa</text>
      <!-- blurred-translation hint: soft pill like the app's hidden translation -->
      <rect x="-72" y="30" width="144" height="34" rx="17" fill="#ffffff" opacity="0.85"/>
      <rect x="-52" y="42" width="104" height="10" rx="5" fill="#8b8b96" opacity="0.55"/>
      <rect x="-72" y="86" width="144" height="10" rx="5" fill="#8b8b96" opacity="0.35"/>
      <rect x="-52" y="110" width="104" height="10" rx="5" fill="#8b8b96" opacity="0.25"/>
    </g>
  </g>
</svg>
